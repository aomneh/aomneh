<html>
<head>
    <title>الملكة امنيه</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #2e003e, #5e0080);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            color: #6a0dad;
            margin-bottom: 30px;
            font-size: 28px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            margin: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn {
            background-color: #8a2be2;
            color: white;
        }

        #yesBtn:hover {
            background-color: #a020f0;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #999;
            color: white;
            position: absolute; /* زي كودك الأصلي */
        }

        .heart {
            position: fixed;
            top: -10px;
            font-size: 20px;
            animation: fall 4s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
      
        <h1>Will you be my Queen? </h1>
        <button id="yesBtn">Yes 💜</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");

        // نفس حركته الأصلية
        noBtn.addEventListener("mouseover", function() {
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        yesBtn.addEventListener("click", function() {

            document.body.innerHTML = `
                <div style="
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    flex-direction:column;
                    background: linear-gradient(135deg, #2e003e, #5e0080);
                    font-family:'Segoe UI';
                    text-align:center;
                    color:white;
                ">
                    <h1 style="font-size:34px;">Just for you 💜</h1>

                    <img src="my.jpeg"
                         style="
                            width:250px;
                            height:250px;
                            object-fit:cover;
                            border-radius:50%;
                            margin:20px 0;
                            box-shadow:0 15px 35px rgba(0,0,0,0.5);
                         ">

                    <p style="font-size:20px;">Open it 🎁</p>

                    <button onclick="window.open('https://open.anghami.com/s4DggP0hJ0b')"
                        style="
                        padding:12px 30px;
                        font-size:18px;
                        border:none;
                        border-radius:30px;
                        background:white;
                        color:#6a0dad;
                        cursor:pointer;
                        margin-top:20px;
                    ">
                        اسمعي الاغنيه 🎧
                    </button>
                </div>
            `

            createHearts();
        });

        // غيرنا شكل القلوب فقط
        function createHearts() {
            setInterval(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart");

                const shapes = ["💜"];
                heart.innerHTML = shapes[Math.floor(Math.random() * shapes.length)];

                heart.style.left = Math.random() * 100 + "vw";
                heart.style.fontSize = (Math.random() * 20 + 15) + "px";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }, 300);
        }
    </script>

</body>
</html>
